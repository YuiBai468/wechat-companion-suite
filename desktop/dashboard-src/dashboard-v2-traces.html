<section class="trace-explorer card" id="traceExplorer">
  <div class="trace-heading"><div><div class="well-eyebrow">MODEL FLIGHT RECORDER</div><h2>每一次调用，都有原文可查</h2><p>选择模型和调用记录，查看实际输入、返回的思考及输出。</p></div><button class="well-icon" data-v2="traces-refresh" aria-label="刷新模型调用记录">↻</button></div>
  <div id="traceModelFilters" class="trace-model-filters" aria-label="模型筛选"></div>
  <div id="traceError" class="v2-notice" hidden></div>
  <div class="trace-layout"><div class="trace-list-side"><div class="trace-list-head"><span>调用记录</span><span id="traceCount">0 次</span></div><div id="traceCallList" class="trace-call-list"><div class="v2-empty">还没有调用记录<br><small>模型下一次被调用后会自动显示。</small></div></div></div><div class="trace-detail-side"><div class="trace-selection-head" id="traceSelectionHead">选择一条调用</div><div class="trace-content-tabs" role="tablist" aria-label="调用内容"><button class="selected" role="tab" aria-selected="true" data-v2="trace-tab" data-value="input">原始输入</button><button role="tab" aria-selected="false" data-v2="trace-tab" data-value="reasoning">思考过程</button><button role="tab" aria-selected="false" data-v2="trace-tab" data-value="output">原始输出</button><span class="trace-tab-spacer"></span><button class="trace-copy" data-v2="trace-copy">复制原文</button></div><div class="trace-text-meta" id="traceTextMeta">文本保留原文；图片和音频显示媒体信息。</div><pre class="trace-original-text" id="traceOriginalText" tabindex="0">还没有选择调用</pre><details class="trace-json"><summary>查看请求与响应 JSON</summary><div class="trace-json-grid"><div><h4>请求</h4><pre id="traceRequestJson" tabindex="0">—</pre></div><div><h4>响应</h4><pre id="traceResponseJson" tabindex="0">—</pre></div></div></details></div></div>
</section>
